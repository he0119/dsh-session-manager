<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="64" height="64" role="img" aria-label="dsh-session-manager">
  <!-- 会话日志卡 + 向右的箭头：一个会话被搬走 / 带走。刻意不画底板——宿主在插件列表里
       自带一圈 48px 圆角边框（卡片位）与 40px（行位），再套一个方块就成了双层框；
       官方 artwork 与同门的 dsh-aperture 也都是透明底。渐变两端的明度都够，深浅底都能看。 -->
  <defs>
    <linearGradient id="sessionManagerShift" x1="3" y1="6" x2="33" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1FB6D4"/>
      <stop offset="1" stop-color="#3B6FF5"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#sessionManagerShift)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.8" y="7.4" width="16.8" height="21.2" rx="4.2" stroke-width="2.6"/>
    <path d="M8.2 14.2h6.2M8.2 19.4h3.8" stroke-width="2.4"/>
    <path d="M22.6 18h8.8" stroke-width="2.8"/>
    <path d="M27.8 14.2 31.9 18l-4.1 3.8" stroke-width="2.8"/>
  </g>
</svg>
