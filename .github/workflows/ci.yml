name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    # on.push.branches 已经让标签推送不触发本工作流；以 workflow_call 被复用时 github 上下文
    # 仍属于调用方，因此这里不写「push 到标签就跳过」这类条件。
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 一步装好 pnpm 与 Node：pnpm 版本不在 workflow 里写死，`pnpm/setup` 读 package.json 的
      # packageManager（与本地 corepack 同一个版本）；Node 钉在 engines 的下限，确保不会无意中依赖更高
      # 版本。`require-lockfile` 让这次安装就是 `--frozen-lockfile`（安装由它自己跑，不用再来一步）。
      - uses: pnpm/setup@v3
        with:
          runtime: node@22.19.0
          cache: true
          require-lockfile: true
      # 类型检查：源文件是 TypeScript，这一步同时覆盖「语法能否解析」与「类型是否自洽」。
      - run: pnpm run typecheck
      # 构建产物必须真的出得来——tsdown 不做类型检查，所以它与 typecheck 是两件独立的事。
      - run: pnpm run build
      # 打包内容与入口自洽：产物之外还有一层「包进宿主时缺了什么」，只有过一遍 npm 自己
      # 的打包器才看得见（见 docs/releasing.md）。放在 build 之后，它依赖 lib/ 存在。
      - run: pnpm run check:package
      # 这里用的是进程内 runner（test/run-all.mjs），不是 `node --test`：后者为每个测试文件
      # spawn 子进程，在受限环境里会因命名管道不可用而 EPERM。详见 docs/development.md。
      # 工具层那一组会 import 真实（devDependency）的 @deepseek-ai/dsh-tools，因此 CI 会真正跑到它。
      - run: pnpm test

  bench:
    # 性能基准不挂进必需的 `check`：它跑在共享 runner 上，绝对耗时随机器与邻居波动，红了不代表代码坏了。
    # 这里只把数字留下来（artifact），回归与否由维护者在本机跑 `pnpm bench` 判定——口径见 bench/README.md。
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          runtime: node@22.19.0
          cache: true
          require-lockfile: true
      # 夹具第一次跑要现场生成（约 10 秒），之后同一次 job 里复用不到，所以这里每次都从头来。
      - run: pnpm run bench --no-check --json > bench-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: bench-report.json
          if-no-files-found: error
